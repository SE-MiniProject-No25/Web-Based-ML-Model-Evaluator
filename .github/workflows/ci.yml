name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    # Windows as well as Linux: the Windows-only import bug fixed in #44 got through when CI ran on Linux only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test, with line and branch coverage
        run: pytest --cov --cov-report=json --cov-report=html --cov-report=term
      - name: Check the coverage thresholds (90% line, 85% branch)
        run: python scripts/check_coverage.py
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            backend/coverage.json
            backend/htmlcov/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test, with line and branch coverage
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          if-no-files-found: ignore
