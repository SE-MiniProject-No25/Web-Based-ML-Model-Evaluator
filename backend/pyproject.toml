[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: tests one component on its own (pure functions, small apps built inside the test)",
    "system: tests through the whole application (HTTP API, a real server, or a real model run in a child process)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long documentation strings and example messages.
"app/api/docs.py" = ["E501"]
"scripts/generate_reports.py" = ["E501"]

[tool.coverage.run]
branch = true
source = ["app"]
# Code that runs in child processes (the model worker and inspector) is not measured by the system tests;
# tests/test_worker.py and tests/test_model_inspector.py call it in-process so it is measured.

[tool.coverage.report]
show_missing = true
skip_empty = true
